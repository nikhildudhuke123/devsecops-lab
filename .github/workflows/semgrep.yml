name: Semgrep SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semgrep:
    name: Semgrep Security Scan
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: python3 -m pip install semgrep

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error .

      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e

      - name: Build Docker image
        run: docker build --no-cache -t devsecops-lab:${{ github.sha }} ./app

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: devsecops-lab:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ github.sha }}.json
          artifact-name: sbom-${{ github.sha }}.json

      - name: Start application for DAST
        run: docker run -d --name devsecops-dast -p 5001:5000 devsecops-lab:${{ github.sha }}

      - name: Wait for application
        run: for i in {1..30}; do curl -fsS http://127.0.0.1:5001/ && break; sleep 2; done

      - name: Run OWASP ZAP DAST
        run: docker run --rm --user 0 --network host -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:5001 -r zap-report.html -I

      - name: Stop DAST container
        if: always()
        run: docker rm -f devsecops-dast || true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: devsecops-lab:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Tag image for GHCR
        run: docker tag devsecops-lab:${{ github.sha }} ghcr.io/nikhildudhuke123/devsecops-lab:${{ github.sha }}

      - name: Push image to GHCR
        run: docker push ghcr.io/nikhildudhuke123/devsecops-lab:${{ github.sha }}
